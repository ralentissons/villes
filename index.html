<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Info villes de France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#F2F4F8; --surface:#FBFCFF; --ink:#171D2B; --muted:#596273; --line:#D7DCE6; --dot:#B5BDCB;
  --accent:#285BD6; --nature:#3F8F66; --beton:#79828A;
  --c1:#2F4B7C; --c2:#A8741A; --c3:#83406A; --warn:#A63B2F; --tint:rgba(40,91,214,.14);
  --head:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101521; --surface:#181F2E; --ink:#E8ECF5; --muted:#A0A9BA; --line:#30394B; --dot:#424D61;
    --accent:#86A6FF; --nature:#4FA77A; --beton:#8E979E;
    --c1:#7C9BD6; --c2:#D6A14A; --c3:#C98BB0; --warn:#E5776A; --tint:rgba(134,166,255,.18);
  }
}
:root[data-theme="dark"]{
  --bg:#101521; --surface:#181F2E; --ink:#E8ECF5; --muted:#A0A9BA; --line:#30394B; --dot:#424D61;
  --accent:#86A6FF; --nature:#4FA77A; --beton:#8E979E;
  --c1:#7C9BD6; --c2:#D6A14A; --c3:#C98BB0; --warn:#E5776A; --tint:rgba(134,166,255,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}
small{font-size:.8em;color:var(--muted);font-weight:400}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.stat-val,.score-big{font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand-logo{width:32px;height:32px;object-fit:contain}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:500;color:var(--muted)}
nav a[aria-current="page"]{color:var(--ink);background:var(--tint)}
main{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(30px,5.5vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0 0 10px}
h2{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0 0 14px}
.lede{color:var(--muted);max-width:60ch;margin:0 0 22px}
.demo{border-left:4px solid var(--c2);padding:8px 14px;margin:0 0 26px;font-size:14px;color:var(--muted);background:var(--surface)}

/* Classement : carte plein cadre */
.map-layout{display:flex;align-items:stretch;height:calc(100svh - 190px);min-height:480px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#CFE9EF}
.map-wrap{position:relative;flex:1 1 auto;min-width:0}
#city-map{position:absolute;inset:0}

/* Panneau ville : glisse depuis la gauche au clic sur une commune */
.city-panel{flex:0 0 auto;width:0;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);transition:width .25s ease}
.city-panel.open{width:min(380px,86vw)}
.city-panel-in{width:min(380px,86vw);height:100%;overflow-y:auto;padding:18px 20px 24px}
.panel-top{display:flex;justify-content:flex-end}
.panel-top.two{justify-content:space-between;align-items:center}
.panel-back{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 6px;margin-left:-6px;border-radius:6px}
.panel-back:hover{background:var(--tint)}
.panel-close{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.panel-close:hover{background:var(--tint);color:var(--ink)}
.panel-crumb{color:var(--muted);font-size:13.5px;margin:0 0 4px}
.panel-name{font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0 0 10px;line-height:1.1}
.panel-score{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px}
.panel-score-tag{display:inline-block;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;margin-bottom:10px;color:#fff}
.panel-score-val{font-family:var(--head);font-weight:800;font-size:40px;letter-spacing:-.02em}
.panel-score-val{display:block}
button.panel-score{display:block;width:100%;text-align:left;background:transparent;padding:16px}
button.panel-score:hover{border-color:var(--accent)}
.panel-score-more{display:block;margin-top:10px;font-size:14px;font-weight:600;color:var(--accent)}
.panel-score-val small{font-family:var(--body);font-weight:500;font-size:16px;color:var(--muted);margin-left:2px}
.panel-stats{display:grid;gap:0;margin-bottom:18px}
.panel-stats .stat{padding:10px 0}
.panel-link{display:inline-block;font-weight:600;color:var(--accent);text-decoration:none}
.panel-link:hover{text-decoration:underline}
@media (max-width:700px){
  .city-panel.open{position:absolute;inset:0;z-index:20;width:100%}
  .city-panel-in{width:100%}
}
.map-search{position:absolute;z-index:5;top:12px;left:12px;width:min(420px,calc(100% - 84px))}
.map-search input{width:100%;font:inherit;font-size:16px;padding:12px 16px;border:0;border-radius:12px;background:#fff;color:#16231D;box-shadow:0 2px 10px #16231d33;min-height:46px}
.sug{list-style:none;margin:6px 0 0;padding:4px;background:#fff;color:#16231D;border-radius:12px;box-shadow:0 2px 10px #16231d33;max-height:280px;overflow-y:auto}
.sug:empty{display:none}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:15px}
.sug button:hover,.sug button:focus-visible{background:var(--tint)}
.sug small{color:#5A675F}
.map-views{position:absolute;z-index:5;top:118px;right:10px;display:grid;gap:0;background:#fff;border-radius:8px;box-shadow:0 1px 5px #16231d33;overflow:hidden}
.map-views button{border:0;background:#fff;color:#16231D;padding:9px 8px;font-size:12px;font-weight:600;min-width:38px;border-bottom:1px solid #E1E6E1}
.map-views button:last-child{border-bottom:0}
.map-views button:hover{background:var(--tint)}
.map-legend{position:absolute;z-index:5;right:10px;bottom:28px;width:min(300px,calc(100% - 20px));padding:14px 16px;border-radius:14px;background:#fff;color:#16231D;box-shadow:0 2px 10px #16231d33}
.map-legend strong{display:block;font-family:var(--head);font-size:16px;margin-bottom:10px}
.leg-bar{display:grid;grid-template-columns:repeat(5,1fr);height:8px;border-radius:4px;overflow:hidden}
.leg-ends{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:#5A675F}
.maplibregl-popup-content{font-family:var(--body);color:#16231D;padding:12px 14px}
.maplibregl-popup-content a{display:inline-block;margin-top:5px;color:var(--accent);font-weight:600}
.map-note{color:var(--muted);font-size:13px;margin:12px 0 0}

/* Courbe d'évolution (panneau) */
.panel-chart{border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px;margin-bottom:20px}
.panel-chart h3{font-family:var(--head);font-weight:700;font-size:16px;margin:0 0 4px}
.ch-sum{font-size:13px;color:var(--muted);margin:0 0 8px}
.ch-read{font-size:14px;min-height:21px;margin:0 0 2px;font-variant-numeric:tabular-nums}
.ch-read b{font-family:var(--head)}
.ch-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i{display:inline-block;width:18px;border-top:3px solid var(--accent)}
.ch-legend i.long{border-top:3px dashed var(--c1)}
.ch-svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-line.long{stroke:var(--c1);stroke-dasharray:5 3}
.ch-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.ch-dot.long{stroke:var(--c1)}
.ch-guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ch-mark{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.ch-mark.long{fill:var(--c1)}
.ch-tx{font:11px var(--body);fill:var(--muted)}

/* Classement complet (panneau) */
.city-panel-in.ranking{display:flex;flex-direction:column;overflow:hidden}
.rk-filter{display:grid;gap:4px;font-size:13.5px;color:var(--muted);margin:0 0 10px}
.rk-filter select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rk-you{font-size:14px;margin:0 0 10px;padding:8px 12px;background:var(--tint);border-radius:8px}
.rk-list{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.rk-spacer{position:relative}
.rk-row{position:absolute;left:0;right:0;height:40px;display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:0 6px;text-align:left;font-size:14px}
.rk-row:hover{background:var(--tint)}
.rk-row.me{background:var(--tint);font-weight:600}
.rk-rank{color:var(--muted);font-variant-numeric:tabular-nums}
.rk-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-val{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums}

/* Liste accessible (équivalent clavier / lecteur d'écran à la carte) */
.map-alt{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.map-alt>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.map-alt>summary::-webkit-details-marker{display:none}
.map-alt>summary::after{content:"▾";color:var(--muted)}
.map-alt[open]>summary::after{content:"▴"}
.map-alt-list{margin:0;padding:0 16px 14px;max-height:340px;overflow-y:auto;display:grid;gap:0}
.map-alt-list li{list-style:none;border-top:1px solid var(--line);padding:10px 0}
.map-alt-list li:first-child{border-top:0}
.map-alt-list a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;font-weight:600}
.map-alt-list a span:last-child{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}


/* Fiche ville */
.back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--ink)}
.meta{color:var(--muted);margin:0 0 14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface)}
.pill b{font-family:var(--head)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px}
.tabs button{background:none;border:0;padding:12px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr;gap:28px}}
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,340px);aspect-ratio:1}
.waffle i{border-radius:2px;background:var(--nature)}
.waffle i.b{background:var(--beton)}
.waffle.anim i.b{animation:pave .4s ease-out backwards;animation-delay:calc(var(--i)*12ms + .3s)}
@keyframes pave{from{background:var(--nature)}to{background:var(--beton)}}
@media (prefers-reduced-motion:reduce){.waffle.anim i.b{animation:none}html{scroll-behavior:auto}}
.legend{margin:14px 0 0;padding:0;list-style:none;font-size:14px;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.stat{padding:14px 0;border-bottom:1px solid var(--line)}
.stat:first-of-type{padding-top:0}
.stat-top{display:grid;grid-template-columns:1fr auto 84px;gap:10px;align-items:baseline}
.stat-lab{font-weight:500}
.stat-val{font-family:var(--head);font-weight:700;font-size:21px}
.stat-val small{font-family:var(--body);margin-left:3px}
.stat-rk{text-align:right;font-size:13px;color:var(--muted)}
.strip{position:relative;height:18px;margin:8px 8px 0}
.strip .trk{position:absolute;left:-8px;right:-8px;top:8px;height:2px;background:var(--line)}
.strip i{position:absolute;top:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--dot)}
.strip .med{position:absolute;top:3px;width:2px;height:12px;margin-left:-1px;background:var(--muted)}
.strip b{position:absolute;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:1px 0 0}
.score-big{font-family:var(--head);font-weight:800;font-size:68px;line-height:1;letter-spacing:-.03em}
.score-big small{font-size:22px;font-family:var(--body);margin-left:4px}
.parts{display:grid;gap:12px;margin:18px 0 26px}
.part{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14.5px}
.part .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.part .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.part span:last-child{color:var(--muted)}
.risks{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.risks li{border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:4px 10px;font-size:14px}
.projects{list-style:none;margin:0;padding:0;display:grid;gap:0}
.projects li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 0 16px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--accent)}
.projects li.prevu{border-left-color:var(--c2)}
.projects li.termine{border-left-color:var(--beton)}
.projects h3{margin:0;font-family:var(--head);font-size:18px}
.projects .st{font-weight:600;font-size:14px;text-align:right}
.projects .tp{color:var(--muted);font-size:14px}
.projects .ec{color:var(--muted);font-size:14px;text-align:right}

/* Comparateur */
.sels{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px}
.sel{display:grid;gap:4px;font-size:14px;color:var(--muted);border-top:4px solid var(--c1);padding-top:8px}
.sel.s2{border-top-color:var(--c2)} .sel.s3{border-top-color:var(--c3)}
.cmp-group{margin-bottom:30px}
.cmp-row{padding:14px 0;border-bottom:1px solid var(--line)}
.cmp-row>b{display:block;font-weight:600;margin-bottom:8px}
.cmp-line{display:grid;grid-template-columns:96px 1fr 130px;gap:12px;align-items:center;padding:3px 0;font-size:14.5px}
.cmp-bar{height:12px;background:transparent}
.cmp-bar i{display:block;height:100%;border-radius:0 6px 6px 0;background:var(--c1)}
.cmp-bar i.s2{background:var(--c2)} .cmp-bar i.s3{background:var(--c3)}
.cmp-bar i.dim{opacity:.4}
.cmp-val{text-align:right;font-family:var(--head);font-weight:600}
.cmp-val.best{font-weight:800}
@media (max-width:520px){.cmp-line{grid-template-columns:70px 1fr 100px;gap:8px}.stat-top{grid-template-columns:1fr auto}.stat-rk{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/"><img class="brand-logo" src="logo.PNG" alt="">Info villes de France</a>
  <nav aria-label="Navigation principale"><a href="#/" id="nav-rk">Classement</a><a href="#/comparer" id="nav-cmp">Comparer</a></nav>
</div></header>
<main id="app"></main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="com-data.js"></script>
<script>
/* ============ DONNÉES (démonstration) ============
   Populations et superficies : ordres de grandeur.
   Autres indicateurs : valeurs indicatives, à remplacer par les jeux officiels. */

let CITIES = [];
let byId = {};

/* Score écologique : pondérations affichées telles quelles à l'écran.
   Fonction (pas IIFE) car CITIES est vide au chargement : elle doit être
   rappelée après chaque fusion de données (voir fin de applyLovacRows). */
const W = {artif:.30, verts:.25, air:.20, douces:.25};
function computeScores(){
  const mm={};
  for(const k in W){
    const v=CITIES.map(c=>c[k]).filter(Number.isFinite);
    if(v.length)mm[k]=[Math.min(...v),Math.max(...v)];
  }
  CITIES.forEach(c=>{
    if(!Object.keys(W).every(k=>Number.isFinite(c[k])))return; // score seulement si les 4 indicateurs sont connus pour cette commune
    c.parts={};let s=0;
    for(const k in W){let n=(c[k]-mm[k][0])/(mm[k][1]-mm[k][0]);if(k==='artif')n=1-n;c.parts[k]=n;s+=W[k]*n}
    c.score=s*100;
  });
}

/* ============ INDICATEURS ============ */
const fmtInt=n=>Number.isFinite(n)?Math.round(n).toLocaleString('fr-FR'):'—';
const fmt1=n=>Number.isFinite(n)?n.toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';
const M={
  pop:{label:'Habitants',unit:'',f:fmtInt,dir:0},
  densite:{label:'Densité',unit:' hab/km²',f:fmtInt,dir:0},
  evo:{label:'Évolution sur 10 ans',unit:' %',f:v=>(v>0?'+':'')+fmt1(v),dir:0},
  age:{label:'Âge moyen',unit:' ans',f:fmt1,dir:0},
  surf:{label:'Superficie',unit:' km²',f:fmt1,dir:0},
  revenu:{label:'Revenu médian',unit:' €/an',f:fmtInt,dir:1},
  chomage:{label:'Taux de chômage',unit:' %',f:fmt1,dir:-1},
  pauvrete:{label:'Taux de pauvreté',unit:' %',f:fmt1,dir:-1},
  prix:{label:'Prix au m²',unit:' €',f:fmtInt,dir:0},
  vacants:{label:'Logements vacants',unit:' %',f:fmt1,dir:-1},
  vacants2:{label:'Vacants depuis plus de 2 ans',unit:' %',f:fmt1,dir:-1},
  social:{label:'Logements sociaux',unit:' %',f:fmt1,dir:0},
  artif:{label:'Sols artificialisés',unit:' %',f:fmt1,dir:-1},
  verts:{label:'Espaces verts par habitant',unit:' m²',f:fmt1,dir:1},
  air:{label:'Jours de bonne qualité de l’air',unit:' %',f:fmtInt,dir:1},
  douces:{label:'Trajets domicile-travail à pied ou à vélo',unit:' %',f:fmt1,dir:1},
  score:{label:'Score écologique',unit:' /100',f:fmtInt,dir:1}
};
const ord=r=>r==null?'—':r===1?'1ᵉʳ':r+'ᵉ';
function rankOf(c,k){
  const d=M[k].dir;
  const s=CITIES.filter(city=>Number.isFinite(city[k])).sort((a,b)=>d<0?a[k]-b[k]:b[k]-a[k]);
  const rank=s.findIndex(x=>x.id===c.id)+1;
  return rank||null;
}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const $app=document.getElementById('app');

/* Historique des logements vacants, par code commune :
   { "44109": [[2019, nbVacants, parcTotal], [2020, …], …], … }
   Source : window.COM_HISTORY (com-history.js) ou 8ᵉ colonne des lignes de COM_DATA. */
const HIST={};
function histOf(city){
  const h=city&&HIST[city.code];
  if(!Array.isArray(h))return [];
  return h.filter(p=>Array.isArray(p)&&Number.isFinite(+p[0])&&Number.isFinite(+p[1])).map(p=>{
    const t=Number(p[2]);
    return {y:+p[0],n:+p[1],r:Number.isFinite(t)&&t>0?+p[1]/t*100:null};
  }).sort((a,b)=>a.y-b.y);
}
function applyLovacRows(rows){
  if(window.COM_HISTORY&&typeof window.COM_HISTORY==='object')Object.assign(HIST,window.COM_HISTORY);
  if(!Array.isArray(rows)){
    console.warn('COM_DATA introuvable ou invalide : données LOVAC non chargées.');
    return;
  }
  const records=rows.map(row=>Array.isArray(row)?{CODGEO_26:row[0],LIBGEO_26:row[1],DEP:row[2],LIB_REG:row[3],pp_vacant_26:row[4],pp_vacant_plus_2ans_26:row[5],ff_pp_total_25:row[6],hist:row[7]}:row);
  records.forEach(row=>{
    const code=String(row.CODGEO_26||'');
    if(Array.isArray(row.hist)){
      HIST[code]=row.hist;
      return;
    }
    const history=[];
    for(let year=2020;year<=2026;year++){
      const count=row[`pp_vacant_${String(year).slice(-2)}`];
      const totalYear=String(year===2020?2020:year-1).slice(-2);
      if(count!==undefined)history.push([year,count,row[`ff_pp_total_${totalYear}`]]);
    }
    if(history.length)HIST[code]=history;
  });
  const byNameDep=new Map(records.map(row=>[`${String(row.DEP||'')}|${norm(String(row.LIBGEO_26||''))}`,row]));
  let updated=0;
  CITIES.forEach(city=>{
    const row=byNameDep.get(`${String(city.dep)}|${norm(city.nom)}`);
    const vacant=Number(row?.pp_vacant_26), vacant2=Number(row?.pp_vacant_plus_2ans_26), total=Number(row?.ff_pp_total_25);
    if(row){city.code=String(row.CODGEO_26);city.lovac=row;if(Number.isFinite(vacant))city.vacantsNombre=vacant}
    if(row&&Number.isFinite(vacant)&&Number.isFinite(total)&&total>0){
      city.vacants=vacant/total*100;city.parc=total;
      city.vacants2=Number.isFinite(vacant2)?vacant2/total*100:null;
      updated++;
    }
  });
  const knownCodes=new Set(CITIES.map(city=>city.code).filter(Boolean));
  let added=0;
  records.forEach(row=>{
    const nom=String(row.LIBGEO_26||'').trim();
    const code=String(row.CODGEO_26||'');
    const vacant=Number(row.pp_vacant_26), vacant2=Number(row.pp_vacant_plus_2ans_26), total=Number(row.ff_pp_total_25);
    if(!nom||!code||knownCodes.has(code))return;
    knownCodes.add(code);
    const vacancyRate=Number.isFinite(vacant)&&Number.isFinite(total)&&total>0?vacant/total*100:null;
    const longVacancyRate=Number.isFinite(vacant2)&&Number.isFinite(total)&&total>0?vacant2/total*100:null;
    CITIES.push({id:`com-${code}`,code,nom,dep:String(row.DEP||''),region:String(row.LIB_REG||''),pop:null,surf:null,evo:null,age:null,revenu:null,chomage:null,pauvrete:null,prix:null,vacants:vacancyRate,vacants2:longVacancyRate,vacantsNombre:Number.isFinite(vacant)?vacant:null,parc:Number.isFinite(total)&&total>0?total:null,social:null,artif:null,verts:null,air:null,douces:null,risques:[],projets:[],lovac:row});
    added++;
  });
  byId=Object.fromEntries(CITIES.map(city=>[city.id,city]));
  CITIES.forEach(city=>{if(Number.isFinite(city.pop)&&Number.isFinite(city.surf)&&city.surf>0)city.densite=city.pop/city.surf});
  computeScores();
  render();
}

function strip(c,k){
  const v=CITIES.map(x=>x[k]).filter(Number.isFinite).sort((a,b)=>a-b);
  if(!Number.isFinite(c[k])||!v.length)return '';
  const mn=v[0],mx=v[v.length-1],med=(v[(v.length-1)>>1]+v[v.length>>1])/2;
  const pos=x=>mx===mn?50:((x-mn)/(mx-mn))*100;
  const dots=CITIES.filter(x=>x.id!==c.id).map(x=>`<i style="left:${pos(x[k])}%"></i>`).join('');
  return `<div class="strip" aria-hidden="true"><span class="trk"></span>${dots}<span class="med" style="left:${pos(med)}%" title="Médiane"></span><b style="left:${pos(c[k])}%"></b></div><div class="ends" aria-hidden="true"><span>${M[k].f(mn)}</span><span>${M[k].f(mx)}</span></div>`;
}
function statRow(c,k){
  const m=M[k];
  return `<div class="stat"><div class="stat-top"><span class="stat-lab">${m.label}</span><span class="stat-val">${m.f(c[k])}<small>${m.unit}</small></span><span class="stat-rk">${ord(rankOf(c,k))} sur ${CITIES.length}</span></div>${strip(c,k)}</div>`;
}
function waffle(c,anim){
  if(!Number.isFinite(c.artif))return '<p class="note">Donnée d’artificialisation non disponible pour cette commune.</p>';
  const n=Math.round(c.artif);let cells='';
  for(let i=0;i<100;i++)cells+=`<i class="${i<n?'b':''}" style="--i:${i}"></i>`;
  return `<div class="waffle ${anim?'anim':''}" role="img" aria-label="Sur 100 hectares, ${n} sont artificialisés">${cells}</div>
  <ul class="legend"><li><i style="background:var(--beton)"></i>${n} ha artificialisés</li><li><i style="background:var(--nature)"></i>${100-n} ha naturels, agricoles ou forestiers</li></ul>
  <p class="note">Chaque case représente 1 % de la surface de la commune.</p>`;
}

/* Courbe d'évolution */
function longVacancyHistOf(city){
  const row=city&&city.lovac;
  if(!row)return [];
  const points=[];
  for(let year=2020;year<=2026;year++){
    const suffix=String(year).slice(-2);
    const totalSuffix=String(year===2020?2020:year-1).slice(-2);
    const count=Number(row[`pp_vacant_plus_2ans_${suffix}`]);
    const total=Number(row[`ff_pp_total_${totalSuffix}`]);
    if(Number.isFinite(count)&&Number.isFinite(total)&&total>0)points.push({y:year,n:count,r:count/total*100});
  }
  return points;
}
function historyChart(city){
  const id='vacancy-comparison';
  charts={};
  const longByYear=new Map(longVacancyHistOf(city).map(point=>[point.y,point]));
  const pts=histOf(city).flatMap(point=>{
    const long=longByYear.get(point.y);
    return Number.isFinite(point.r)&&long&&Number.isFinite(long.r)?[{y:point.y,vacantRate:point.r,vacantCount:point.n,longRate:long.r,longCount:long.n}]:[];
  });
  const title='Évolution de la part des logements vacants';
  if(pts.length<2)return `<section class="panel-chart"><h3>${title}</h3><p class="note" style="margin:0 0 8px">Historique comparatif pluriannuel non disponible pour cette commune.</p></section>`;
  const W=340,H=176,L=40,R=16,T=14,B=28;
  const vs=pts.flatMap(point=>[point.vacantRate,point.longRate]);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  const pad=(hi-lo)*.2||Math.max(Math.abs(hi)*.05,.5);
  lo=Math.max(0,lo-pad);hi+=pad;
  const y0=pts[0].y,y1=pts[pts.length-1].y;
  const X=y=>L+(y-y0)/((y1-y0)||1)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const xs=pts.map(p=>X(p.y));
  const series=[{key:'vacant',label:'Tous logements vacants',rateKey:'vacantRate',countKey:'vacantCount',className:''},{key:'long',label:'Vacants depuis plus de 2 ans',rateKey:'longRate',countKey:'longCount',className:' long'}];
  const grid=[lo,(lo+hi)/2,hi].map(t=>`<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="ch-tx" x="${L-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${fmt1(t)} %</text>`).join('');
  const step=pts.length>8?2:1;
  const xl=pts.map((p,i)=>i%step?'':`<text class="ch-tx" x="${xs[i].toFixed(1)}" y="${H-8}" text-anchor="middle">${p.y}</text>`).join('');
  const a=pts[0],b=pts[pts.length-1];
  const delta=key=>{
    const value=b[key]-a[key];
    return `${value>0?'+':value<0?'−':''}${fmt1(Math.abs(value))} pt`;
  };
  const sum=`Logements vacants`;
  series.forEach(item=>{item.ys=pts.map(point=>Y(point[item.rateKey]))});
  const lines=series.map(item=>{
    const path=xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)} ${item.ys[i].toFixed(1)}`).join('');
    const dots=xs.map((x,i)=>`<circle class="ch-dot${item.className}" cx="${x.toFixed(1)}" cy="${item.ys[i].toFixed(1)}" r="3.5"/>`).join('');
    return `<path class="ch-line${item.className}" d="${path}"/>${dots}<circle class="ch-mark${item.className}" id="${id}-${item.key}-mark" r="6"/>`;
  }).join('');
  charts[id]={pts,xs,W,i:pts.length-1,series};
  return `<section class="panel-chart"><h3>${title}</h3>
  <p class="ch-sum">${sum}</p><div class="ch-legend"><span><i></i>Tous logements vacants</span><span><i class="long"></i>Vacants depuis plus de 2 ans</span></div><p class="ch-read" id="${id}-read"></p>
  <svg class="ch-svg" data-chart="${id}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Comparaison des parts de logements vacants et de logements vacants depuis plus de deux ans, de ${a.y} à ${b.y}. ${sum} Flèches gauche et droite pour parcourir les années.">${grid}${xl}<line class="ch-guide" id="${id}-guide" y1="${T}" y2="${H-B}"/>${lines}</svg></section>`;
}
function setPoint(id,i){
  const activeChart=charts[id];
  if(!activeChart)return;
  i=Math.max(0,Math.min(activeChart.pts.length-1,i));activeChart.i=i;
  const p=activeChart.pts[i],x=activeChart.xs[i].toFixed(1);
  const g=document.getElementById(`${id}-guide`),r=document.getElementById(`${id}-read`);
  activeChart.series.forEach(item=>document.getElementById(`${id}-${item.key}-mark`).setAttribute('cy',item.ys[i].toFixed(1)));
  if(!g||!r)return;
  g.setAttribute('x1',x);g.setAttribute('x2',x);
  r.innerHTML=`<b>${p.y}</b> · ${fmt1(p.vacantRate)} % (${fmtInt(p.vacantCount)} logements) · ${fmt1(p.longRate)} % depuis plus de 2 ans (${fmtInt(p.longCount)} logements)`;
}
function pickPoint(e){
  const svg=e.target.closest('.ch-svg'),box=svg.getBoundingClientRect();
  const id=svg.dataset.chart,activeChart=charts[id];
  if(!activeChart)return;
  const x=(e.clientX-box.left)/box.width*activeChart.W;
  let best=0,bd=Infinity;
  activeChart.xs.forEach((px,i)=>{const dd=Math.abs(px-x);if(dd<bd){bd=dd;best=i}});
  setPoint(id,best);
}

  <label class="rk-filter">Taille du parc de logements<select id="rk-min">${RK_FILTERS.map(([v,l])=>`<option value="${v}"${v===rk.min?' selected':''}>${l}</option>`).join('')}</select></label>
  <p class="rk-you" id="rk-you"></p>
  <div class="rk-list" id="rk-list" aria-label="Classement des communes"><div class="rk-spacer"></div></div>`;
  document.getElementById('rk-list').addEventListener('scroll',drawRows,{passive:true});
  refreshRanking(true);
  body.querySelector('.panel-back').focus();
}
function initMap(){
  const request=++mapRequest;
  if(!window.maplibregl){document.getElementById('city-map').textContent='La bibliothèque cartographique est indisponible.';return}
  const withRate=CITIES.filter(c=>c.code&&Number.isFinite(c.vacants));
  const byCode=Object.fromEntries(withRate.map(c=>[c.code,c]));
  const cBreaks=VAC_BREAKS=quintiles(withRate.map(c=>c.vacants));
  /* Départements : taux agrégé (total vacants / total du parc) */
  const deps={};
  withRate.forEach(c=>{if(!(c.vacants>0))return;const d=deps[c.dep]||(deps[c.dep]={v:0,t:0});d.v+=c.vacantsNombre;d.t+=c.vacantsNombre/c.vacants*100});
  const depRates=Object.entries(deps).map(([k,d])=>[k,d.v/d.t*100]);
  const dBreaks=quintiles(depRates.map(x=>x[1]));
  const color=['match',['feature-state','k'],...CLASS_COLORS.flatMap((c,i)=>[i,c]),'rgba(0,0,0,0)'];
  const map=cityMap=new maplibregl.Map({container:'city-map',style:STYLE_URL,center:VIEWS.FR.c,zoom:5,minZoom:3,maxZoom:14,attributionControl:{compact:true}});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.on('load',()=>{
    if(request!==mapRequest||cityMap!==map)return;
    map.addSource('admin',{type:'vector',url:TILES_URL,promoteId:{communes:'code',departements:'code'}});
    map.addLayer({id:'dep-fill',type:'fill',source:'admin','source-layer':'departements',maxzoom:8,paint:{'fill-color':color,'fill-opacity':.92}});
    map.addLayer({id:'com-fill',type:'fill',source:'admin','source-layer':'communes',minzoom:8,paint:{'fill-color':color,'fill-opacity':.92}});
    map.addLayer({id:'com-line',type:'line',source:'admin','source-layer':'communes',minzoom:8,paint:{'line-color':'#ffffff','line-opacity':.5,'line-width':.4}});
    depRates.forEach(([code,r])=>map.setFeatureState({source:'admin',sourceLayer:'departements',id:code},{k:classOf(r,dBreaks)}));
    withRate.forEach(c=>{
      const k=classOf(c.vacants,cBreaks);
      map.setFeatureState({source:'admin',sourceLayer:'communes',id:c.code},{k});
      const r=PLM[c.code];
      if(r)for(let n=r[0];n<=r[1];n++)map.setFeatureState({source:'admin',sourceLayer:'communes',id:String(n)},{k});
    });
  });
  map.on('click','dep-fill',e=>map.easeTo({center:e.lngLat,zoom:8.5}));
  map.on('click','com-fill',e=>{
    const p=e.features[0].properties;
    const city=byCode[p.commune||p.code]||byCode[p.code];
    showPopup(e.lngLat,city);
    openPanel(city);
  });
  ['dep-fill','com-fill'].forEach(l=>{
    map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');
  });
  map.on('error',e=>console.warn('Carte :',e.error&&e.error.message));
}

/* ============ VUE : FICHE VILLE ============ */
const TABS=[['apercu','Aperçu'],['demographie','Démographie'],['economie','Économie et logement'],['ecologie','Écologie'],['projets','Projets']];
let lastCity=null;

function viewCity(id,tab){
  const c=byId[id];
  if(!c){$app.innerHTML=`<a class="back" href="#/">← Classement</a><h1>Ville introuvable</h1><p class="lede">Cette ville n’est pas dans la liste. Retournez au classement pour en choisir une.</p>`;return}
  if(!TABS.some(t=>t[0]===tab))tab='apercu';
  const animate=lastCity!==id;lastCity=id;
  let content='';
  if(tab==='apercu'){
    content=`<div class="split"><section><h2>Sur 100 hectares de la commune</h2>${waffle(c,animate)}</section>
    <section><h2>Repères</h2>${['pop','densite','revenu','chomage','prix','score'].map(k=>statRow(c,k)).join('')}${RANK_NOTE}</section></div>`;
  }else if(tab==='demographie'){
    content=`<section><h2>Démographie</h2>${['pop','evo','age','surf','densite'].map(k=>statRow(c,k)).join('')}${RANK_NOTE}</section>`;
  }else if(tab==='economie'){
    content=`<section><h2>Économie et logement</h2>${['revenu','chomage','pauvrete','prix','vacants','vacants2','social'].map(k=>statRow(c,k)).join('')}${RANK_NOTE}</section>`;
  }else if(tab==='ecologie'){
    if(!Number.isFinite(c.score)){
      content='<section><h2>Écologie</h2><p class="lede">Les indicateurs écologiques ne sont pas disponibles dans le fichier COM pour cette commune.</p></section>';
    }else{
      const labels={artif:'Sols préservés (100 − artificialisation)',verts:'Espaces verts par habitant',air:'Qualité de l’air',douces:'Trajets à pied ou à vélo'};
      content=`<div class="split"><section><h2>Sur 100 hectares de la commune</h2>${waffle(c,false)}</section>
    <section><h2>Score écologique</h2>
      <div class="score-big">${fmtInt(c.score)}<small>/100</small></div>
      <p class="note">${ord(rankOf(c,'score'))} sur ${CITIES.length} villes du site.</p>
      <div class="parts">${Object.keys(W).map(k=>`<div class="part"><span>${labels[k]} <small>(poids ${Math.round(W[k]*100)} %)</small></span><span>+${fmt1(W[k]*c.parts[k]*100)} pts</span><div class="track"><i style="width:${c.parts[k]*100}%"></i></div></div>`).join('')}</div>
      ${['artif','verts','air','douces'].map(k=>statRow(c,k)).join('')}
      <h2 style="margin-top:26px">Risques naturels et technologiques</h2>
      <ul class="risks">${c.risques.map(r=>`<li>${r}</li>`).join('')}</ul>
      ${RANK_NOTE}
      </section></div>`;
    }
  }else{
    content=`<section><h2>Projets en cours et récents</h2><ul class="projects">${c.projets.map(p=>`<li class="${p[2]==='Prévu'?'prevu':p[2]==='Terminé'?'termine':''}"><h3>${p[0]}</h3><span class="st">${p[2]}</span><span class="tp">${p[1]}</span><span class="ec">${p[3]==='—'?'Échéance non renseignée':'Échéance : '+p[3]}</span></li>`).join('')}</ul>
    <p class="note">Exemples de saisie manuelle. Chaque projet peut avoir un type, un statut et une échéance ; à vérifier avant publication.</p></section>`;
  }
  $app.innerHTML=`
  <a class="back" href="#/">← Classement</a>
  <h1>${c.nom}</h1>
  <p class="meta">${c.region} · département ${c.dep}</p>
  <div class="pills"><span class="pill"><b>${ord(rankOf(c,'pop'))}</b> par la population</span><span class="pill"><b>${ord(rankOf(c,'score'))}</b> au score écologique</span><span class="pill"><b>${fmt1(c.artif)} %</b> de sols artificialisés</span></div>
  <div class="tabs" role="tablist" aria-label="Sections de la fiche">${TABS.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join('')}</div>
  <div role="tabpanel">${content}</div>
  <p class="demo" style="margin-top:36px"></p>`;
  document.title=`${c.nom} : chiffres clés | Atlas des villes`;
}

/* ============ VUE : COMPARATEUR ============ */
const GROUPS=[['Démographie',['pop','densite','evo','age']],['Économie',['revenu','chomage','pauvrete','prix']],['Logement',['vacants','vacants2','social']],['Écologie',['score','artif','verts','air','douces']]];
function cmpRow(cs,k){
  const m=M[k],v=cs.map(c=>c[k]),valid=v.filter(Number.isFinite),mn=valid.length?Math.min(...valid):0,mx=valid.length?Math.max(...valid):0;
  const best=m.dir?(m.dir>0?mx:mn):null;
  const lines=cs.map((c,i)=>{
    const x=c[k];
    const available=Number.isFinite(x),w=!available?0:mn<0?6+94*((x-mn)/(mx-mn)):(mx===0?3:Math.max(3,x/mx*100));
    const isBest=available&&best!==null&&x===best&&mn!==mx;
    const dim=best!==null&&available&&!isBest&&mn!==mx;
    return `<div class="cmp-line"><span>${c.nom}</span><span class="cmp-bar"><i class="s${i+1} ${dim?'dim':''}" style="width:${w}%"></i></span><span class="cmp-val ${isBest?'best':''}">${m.f(x)}<small>${m.unit}</small></span></div>`;
  }).join('');
  return `<div class="cmp-row"><b>${m.label}</b>${lines}</div>`;
}
function viewCompare(list){
  let ids=[...new Set((list||[]).filter(i=>byId[i]))].slice(0,3);
  if(ids.length<2)ids=['nantes','lyon'];
  const cs=ids.map(i=>byId[i]);
  const opts=[...CITIES].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  const sels=[0,1,2].map(n=>`<label class="sel s${n+1}"><span>Ville ${n+1}${n===2?' (facultative)':''}</span><select data-slot="${n}">${n===2?'<option value="">Aucune</option>':''}${opts.map(c=>`<option value="${c.id}" ${cs[n]&&cs[n].id===c.id?'selected':''}>${c.nom}</option>`).join('')}</select></label>`).join('');
  $app.innerHTML=`
  <h1>Comparer des villes</h1>
  <p class="lede">Choisissez deux ou trois villes. Quand un sens favorable existe, la meilleure valeur est en couleur pleine.</p>
  <div class="sels">${sels}</div>
  ${GROUPS.map(g=>`<section class="cmp-group"><h2>${g[0]}</h2>${g[1].map(k=>cmpRow(cs,k)).join('')}</section>`).join('')}
  <p class="demo"></p>`;
  document.title='Comparer des villes | Atlas des villes';
}

/* ============ ROUTEUR ============ */
function render(){
  const [p1,p2,p3]=location.hash.replace(/^#\/?/,'').split('/');
  const nr=document.getElementById('nav-rk'),nc=document.getElementById('nav-cmp');
  nr.removeAttribute('aria-current');nc.removeAttribute('aria-current');
  if(p1==='ville'||p1==='comparer'){
    mapRequest++;
    clearTimeout(searchTimer);searchTimer=null;
    disposeVacancyMap();
  }
  if(p1==='ville'){
    nr.setAttribute('aria-current','page');
    const prev=lastCity;viewCity(p2,p3);
    if(prev!==lastCity)window.scrollTo(0,0);
  }else if(p1==='comparer'){
    lastCity=null;nc.setAttribute('aria-current','page');
    viewCompare(p2?p2.split(','):[]);window.scrollTo(0,0);
  }else{
    lastCity=null;nr.setAttribute('aria-current','page');
    viewRanking();document.title='Atlas des villes de France';
  }
}
window.addEventListener('hashchange',render);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){const id=location.hash.replace(/^#\/?/,'').split('/')[1];location.hash=`#/ville/${id}/${t.dataset.tab}`;return}
});
document.addEventListener('change',e=>{
  if(e.target.matches('select[data-slot]')){
    const v=[...document.querySelectorAll('select[data-slot]')].map(s=>s.value).filter(Boolean);
    location.hash=`#/comparer/${v.join(',')}`;
  }
});
render();
applyLovacRows(window.COM_DATA);
</script>
